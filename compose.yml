services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: wonderlab
      MYSQL_USER: wonderlab
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - '127.0.0.1:3307:3306'
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent']
      interval: 5s
      timeout: 5s
      retries: 30
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: mysql://wonderlab:${MYSQL_PASSWORD}@mysql:3306/wonderlab
      JWT_SECRET: ${JWT_SECRET:?Set a random JWT_SECRET in .env}
    command: ['node', 'dist/db/migrate.js']
    depends_on:
      mysql:
        condition: service_healthy
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: mysql://wonderlab:${MYSQL_PASSWORD}@mysql:3306/wonderlab
      JWT_SECRET: ${JWT_SECRET:?Set a random JWT_SECRET in .env}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_MODEL: ${AI_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_INPUT_COST_PER_MILLION: ${AI_INPUT_COST_PER_MILLION:-0}
      AI_OUTPUT_COST_PER_MILLION: ${AI_OUTPUT_COST_PER_MILLION:-0}
    volumes:
      - uploaded_files:/app/backend/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      BACKEND_INTERNAL_URL: http://backend:4000
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
    ports:
      - '3000:3000'
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    profiles: ['redis']
    volumes:
      - redis_data:/data
    command: ['redis-server', '--appendonly', 'yes']
volumes:
  mysql_data:
  uploaded_files:
  redis_data:
